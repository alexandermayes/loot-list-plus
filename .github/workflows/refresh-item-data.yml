name: Refresh Item Data

# Two static maps are generated from Wowhead and shipped in the repo:
#
#   data/item-icons.ts  — item icons (see app/components/ItemLink.tsx). Items
#     added to the raid data have no icon entry and render a broken placeholder
#     until the map is regenerated. This ran stale for months once (GH #171).
#   data/item-unique.ts — Unique-Equipped flags (see domain/loot/slot-capacity.ts).
#     Decides whether a ring, trinket or one-hander can be listed twice on a
#     loot list (GH #181). A missing entry is treated as unknown and falls back
#     to the conservative cap, so staleness under-permits rather than letting
#     raiders build lists they can't equip.
#
# Both scripts are incremental — they only fetch ids not already cached — and
# this opens a PR if either map changed. Triggers whenever raid data changes on
# main, and can be run manually from the Actions tab.
#
# Required repo secret: NPM_RC (same one CI uses for the private registry).

on:
  push:
    branches: [main]
    paths:
      - "data/*-raids.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-item-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate item maps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write .npmrc for private registry
        run: printf '%s\n' "$NPM_RC" > .npmrc
        env:
          NPM_RC: ${{ secrets.NPM_RC }}
      - run: npm ci
      - name: Regenerate icon map
        run: npm run icons:fetch
      - name: Regenerate unique-equipped map
        run: npm run unique:fetch
      - name: Open a PR if either map changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          maps="data/item-icons.ts data/item-unique.ts"
          if git diff --quiet -- $maps; then
            echo "Item maps already up to date; nothing to do."
            exit 0
          fi
          added=$(git diff --numstat -- $maps | awk '{s+=$1} END {print s}')
          branch="chore/refresh-item-data-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add $maps
          git commit -m "Refresh item data maps (${added} new lines)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh item data maps" \
            --body "Automated regeneration of \`data/item-icons.ts\` and \`data/item-unique.ts\` from Wowhead — items added to the raid data have no icon entry (broken placeholder) and no Unique-Equipped flag (capped at one copy on loot lists until known). Generated by the Refresh Item Data workflow (\`scripts/fetch-item-icons.ts\`, \`scripts/fetch-item-unique.ts\`). Review and merge to ship."
