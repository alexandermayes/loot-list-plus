name: Deploy Migrations

# Applies pending Supabase migrations to the production database via the
# Management API (scripts/deploy-migrations.sh). Needs only an access token —
# no DB password.
#
# Runs automatically when migration files change on main, and can be triggered
# manually (workflow_dispatch) to apply a backlog of already-merged migrations.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - a Supabase personal access token (sbp_...)
# The project ref below is the same one used by `npm run gen:types`.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: zjnhjstbqekudlsozsvi
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy-migrations.sh
