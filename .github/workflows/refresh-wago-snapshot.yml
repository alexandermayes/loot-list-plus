name: Refresh wago snapshot

# Refreshes data/expansions/forever/reference/wago.json, the committed wago
# reference snapshot behind the Forever manifest gate (EXPN-06). Runs weekly and
# can be run manually from the Actions tab.
#
# Network access lives only in scripts/expansions/snapshot-reference.ts, never
# in runtime or test code. The script retries with backoff, and a wago outage
# exits green with a notice, so an outage never turns this workflow red (D-13).
#
# A PR is opened or updated only when the committed snapshot changed. The
# script never rewrites the file when the build and data hash are unchanged, so
# the fetchedAt timestamp alone cannot trigger a PR. The PR uses one fixed
# branch, so an unmerged PR is updated in place instead of piling up weekly.
#
# PRs created with GITHUB_TOKEN do not trigger other workflows, so CI does not
# run on the bot PR. The PR body says so and asks for a local test run.
#
# Scheduled and manually dispatched workflows only run from the default
# branch, so this file must be on main before the cron fires or the Run
# workflow button appears. There is deliberately no push or pull_request
# trigger, so this can never become a required check.
#
# Required repo secret: NPM_RC (same one CI uses for the private registry).

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-wago-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh wago snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # puppeteer is a devDependency; skip its Chromium download, as CI does.
      PUPPETEER_SKIP_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write .npmrc for private registry
        env:
          NPM_RC: ${{ secrets.NPM_RC }}
        run: |
          if [ -z "$NPM_RC" ]; then
            echo "::error::The NPM_RC secret is empty, so npm ci cannot authenticate to npm.hugeicons.com (required by @hugeicons-pro/*) and will fail with E401."
            exit 1
          fi
          printf '%s\n' "$NPM_RC" > .npmrc
      - run: npm ci
      - name: Refresh the snapshot from wago
        id: snapshot
        run: npx tsx scripts/expansions/snapshot-reference.ts
      - name: Open or update the snapshot PR
        if: steps.snapshot.outputs.outage != 'true' && steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTABLE: ${{ steps.snapshot.outputs.promotable }}
        run: |
          file="data/expansions/forever/reference/wago.json"
          if git diff --quiet -- "$file"; then
            echo "Snapshot file unchanged on disk; nothing to do."
            exit 0
          fi
          branch="chore/refresh-wago-snapshot"
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"

          # The branch is rebuilt every run, but a reviewer may have pushed a
          # fixup (the PR body invites it, and a manifest promotion needs one).
          # Fetch the remote tip first: if its newest commit is not the bot's,
          # stop with an error instead of discarding that work. The lease pins
          # the update to the tip we inspected, so a push landing in between
          # also fails. An empty expected value means "branch must not exist".
          expected=""
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            expected=$(git rev-parse "refs/remotes/origin/$branch")
            tip_email=$(git log -1 --format=%ae "$expected")
            if [ "$tip_email" != "$bot_email" ]; then
              echo "::error::$branch has a commit that is not from this workflow ($expected). Merge or close the open snapshot PR, or move that commit elsewhere, then re-run."
              exit 1
            fi
          fi

          git checkout -B "$branch"
          git add -- "$file"
          git commit -m "Refresh wago reference snapshot"
          git push --force-with-lease="$branch:$expected" origin "$branch"

          if [ -n "$PROMOTABLE" ]; then
            promote="Promotable bosses (wago now lists them): ${PROMOTABLE}. Promote each named boss in data/expansions/forever/manifest.ts and remove it from the allowlist in this same PR, otherwise the Forever reference test fails (D-15)."
          else
            promote="Promotable bosses: none. No manifest change is needed."
          fi
          body="Generated by the Refresh wago snapshot workflow. Review the trimmed rows in data/expansions/forever/reference/wago.json before merging.

          This PR was opened with GITHUB_TOKEN, so CI did not run. Run npm run test locally (or push a commit to this branch) before merging. Once a commit is pushed here, the weekly job will not overwrite it and fails until this PR is merged or closed.

          ${promote}"
          # Strip the YAML indentation from each body line.
          body=$(printf '%s' "$body" | sed 's/^[[:space:]]*//')

          if gh pr create --base main --head "$branch" \
            --title "Refresh wago reference snapshot" \
            --body "$body"; then
            echo "Opened a new snapshot PR."
          else
            gh pr edit "$branch" --body "$body"
            echo "Updated the existing snapshot PR."
          fi
