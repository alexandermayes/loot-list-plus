name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Write .npmrc for private registry
        run: printf '%s\n' "$NPM_RC" > .npmrc
        env:
          NPM_RC: ${{ secrets.NPM_RC }}
      - run: npm ci
      - run: npm run test
