name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Write .npmrc for private registry
        env:
          NPM_RC: ${{ secrets.NPM_RC }}
        run: |
          if [ -z "$NPM_RC" ]; then
            echo "::error::The NPM_RC secret is empty, so npm ci cannot authenticate to npm.hugeicons.com (required by @hugeicons-pro/*) and will fail with E401."
            if [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
              echo "::error::Dependabot runs read the Dependabot secret store, not Actions secrets. Copy the secret over with: gh secret set NPM_RC --app dependabot"
            fi
            exit 1
          fi
          printf '%s\n' "$NPM_RC" > .npmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  companion:
    name: Companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 43's toolchain (@electron/get, @electron/rebuild,
          # @electron-internal/extract-zip) declares node >= 22.12.0, so this
          # job can't share the Node 20 the web app uses.
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      # No .npmrc step: the companion's dependencies are all public, so unlike
      # the web app it doesn't need the npm.hugeicons.com credentials.
      - run: npm ci
        working-directory: companion
      - run: npm run typecheck
        working-directory: companion
      # electron-vite only bundles here — it never launches Electron, so this
      # doesn't pull the ~100MB platform binary.
      - run: npm run build
        working-directory: companion
      - name: Verify build output
        working-directory: companion
        run: |
          for f in out/main/index.js out/preload/index.js out/renderer/index.html; do
            [ -f "$f" ] || { echo "::error::missing build artifact $f"; exit 1; }
          done
          # main/index.js resolves these at runtime relative to out/main
          [ -f out/preload/index.js ]   || exit 1
          [ -f assets/tray-icon.png ]   || { echo "::error::missing assets/tray-icon.png"; exit 1; }
