name: Refresh Item Icons

# Item icons come from the static map data/item-icons.ts (see
# app/components/ItemLink.tsx), NOT live Wowhead. When items are added to the
# raid data files, their ids have no icon entry and render a broken placeholder
# until the map is regenerated. This ran stale for months once (GH #171) — this
# workflow keeps it fresh automatically.
#
# Regenerates the map via scripts/fetch-item-icons.ts (incremental: only fetches
# ids not already cached) and opens a PR if anything changed. Triggers whenever
# raid data changes on main, and can be run manually from the Actions tab.
#
# Required repo secret: NPM_RC (same one CI uses for the private registry).

on:
  push:
    branches: [main]
    paths:
      - "data/*-raids.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-item-icons
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate icon map
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write .npmrc for private registry
        run: printf '%s\n' "$NPM_RC" > .npmrc
        env:
          NPM_RC: ${{ secrets.NPM_RC }}
      - run: npm ci
      - name: Regenerate icon map
        run: npm run icons:fetch
      - name: Open a PR if the icon map changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/item-icons.ts; then
            echo "Icon map already up to date; nothing to do."
            exit 0
          fi
          added=$(git diff --numstat -- data/item-icons.ts | awk '{print $1}')
          branch="chore/refresh-item-icons-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/item-icons.ts
          git commit -m "Refresh item icon map (${added} new icon lines)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh item icon map" \
            --body "Automated regeneration of \`data/item-icons.ts\` — items added to the raid data had no icon entry and would render a broken placeholder. Generated by the Refresh Item Icons workflow (\`scripts/fetch-item-icons.ts\`). Review and merge to ship the icons."
